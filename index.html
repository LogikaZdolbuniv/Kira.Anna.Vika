<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dyson Premium | Pink Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">DYSON</div>
        <div class="cart-icon" onclick="toggleCart()">
            <span class="icon">🛒</span> Кошик (<span id="cart-count">0</span>)
        </div>
        <div class="deve"><a href="anna/indexanna.html">Аня</a></div>
        <div class="deve"><a href="vika/indexvika.html">Віка</a></div>
        <div class="deve"><a href="kira/indexkira.html">Кіра</a></div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>Ceramic Pink <br><span>Limited Edition</span></h1>
            <p>Ваші улюблені технології у новому ніжному кольорі.</p>
            <a href="#products" class="btn-primary">Придбати зараз</a>
        </div>
    </header>

    <main class="products-grid" id="products">
        </main>

    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="toggleCart()">&times;</span>
            <h2>Ваш кошик</h2>
            <div id="cart-items"></div>
            <div class="cart-footer">
                <div class="total">Разом: <span id="cart-total">0</span> грн</div>
                <button class="checkout-btn">Оформити замовлення</button>
            </div>
        </div>
    </div>

    <footer>
        <p class="foot">
            inst: @dyson
        </p>
        <p class="foot">
            adress: вул. Кулика і Гудачека, 18, Рівне, Рівненська обл.
        </p>
        <p class="foot">
            phone number: 095 282 4735
        </p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
