<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Знайомство з автором</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="about-card">
        <div class="image-container">
            <img src="https://via.placeholder.com/400x500" alt="Фото автора">
        </div>
        
        <div class="content">
            <span class="subtitle">Засновниця бренду</span>
            <h1>Марія <br><span>Розенберг</span></h1>
            <p>
                Вітаю! Я створюю речі, які допомагають знайти гармонію між внутрішнім світом та зовнішнім виглядом. Мій бренд — це маніфест сміливості, загорнутий у рожевий шовк.
            </p>
            
            <div class="stats">
                <div class="stat-item">
                    <strong>5+</strong>
                    <span>років досвіду</span>
                </div>
                <div class="stat-item">
                    <strong>1000+</strong>
                    <span>клієнтів</span>
                </div>
            </div>

            <div class="cta-group">
                <a href="#" class="btn btn-outline">Instagram</a>
            </div>
        </div>
    </section>

</body>
</html>
