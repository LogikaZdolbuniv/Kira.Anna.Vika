<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Знайомство з автором</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="about-card">
        <div class="image-container">
            <img src="https://via.placeholder.com/400x500" alt="Фото автора">
        </div>
        
        <div class="content">
            <span class="subtitle">Засновниця бренду</span>
            <h1>Кіра<br><span>Гараніч</span></h1>
            <p>
                Дизайнерка вдень, волейболістка ввечері. Я знаю, як тримати удар і на майданчику, і в бізнесі. Наш бренд створений для тих, хто цінує свободу рухів та яскраві акценти. 
            </p>
            
            <div class="stats">
                <div class="stat-item">
                    <strong>5+</strong>
                    <span>років досвіду</span>
                </div>
                <div class="stat-item">
                    <strong>1000+</strong>
                    <span>клієнтів</span>
                </div>
            </div>

            <div class="cta-group">
                <a href="https://www.instagram.com/kira_haranich/" class="btn btn-outline">Instagram</a>
            </div>
        </div>
    </section>

</body>
</html>
